<!doctype html>
<html lang="es" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tienda | RockStar Store</title>
    <meta name="description"
        content="Catalogo completo de RockStar Store. Filtra por categoria y talla, agrega al carrito y finaliza tu pedido por WhatsApp.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="Tienda | RockStar Store">
    <meta property="og:description"
        content="Catalogo streetwear con variantes por talla, carrito y pedido directo por WhatsApp.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="./assets/page/Banner_background.png">
    <meta property="og:image:alt" content="Catalogo RockStar Store">
    <meta property="og:locale" content="es_MX">
    <meta property="og:site_name" content="RockStar Store">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Tienda | RockStar Store">
    <meta name="twitter:description"
        content="Catalogo streetwear con filtros por categoria y talla, carrito y pedido directo por WhatsApp.">
    <meta name="twitter:image" content="./assets/page/Banner_background.png">
    <link rel="icon" type="image/png" href="./assets/page/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;700;800;900&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/theme.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" href="./css/main.css">
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "CollectionPage",
            "name": "Tienda | RockStar Store",
            "description": "Catalogo completo de RockStar Store con filtros por categoria y talla.",
            "url": "./tienda.html",
            "isPartOf": {
                "@type": "WebSite",
                "name": "RockStar Store",
                "url": "./index.html"
            },
            "mainEntity": {
                "@type": "ItemList",
                "name": "Catalogo RockStar Store",
                "itemListOrder": "https://schema.org/ItemListUnordered"
            }
        }
    </script>
</head>

<body x-data="appStore('store')" x-init="init(); setTimeout(() => window.lucide && window.lucide.createIcons(), 0)"
    x-cloak>
    <div class="site-shell">
        <header class="site-header store-header" @keydown.escape.window="closeMobileMenu()">
            <div class="container-wide nav-inner">
                <a class="header-logo-link" href="./index.html" aria-label="Ir al inicio">
                    <img src="./assets/page/footer_logo.png" alt="RockStar Store">
                </a>
                <nav class="nav-links" id="primary-navigation" :class="{ 'is-open': mobileMenuOpen }" aria-label="Navegacion principal">
                    <a class="nav-link" href="./tienda.html" @click="closeMobileMenu()">Tienda</a>
                    <a class="nav-link" href="./index.html#sobre-nosotros" @click="closeMobileMenu()">Sobre nosotros</a>
                    <a class="nav-link" href="./index.html#contacto" @click="closeMobileMenu()">Contacto</a>
                </nav>
                <div class="nav-actions">
                    <button class="icon-button menu-toggle" type="button" title="Abrir menu" aria-controls="primary-navigation" :aria-expanded="mobileMenuOpen.toString()" @click.stop="toggleMobileMenu()">
                        <i class="bi" :class="mobileMenuOpen ? 'bi-x-lg' : 'bi-list'" aria-hidden="true"></i>
                    </button>
                    <button class="icon-button" type="button" title="Cambiar tema" @click="toggleTheme()">
                        <i class="bi" :class="theme === 'dark' ? 'bi-sun' : 'bi-moon-stars'" aria-hidden="true"></i>
                    </button>
                    <button class="icon-button" type="button" title="Abrir carrito" @click="openCart()">
                        <i data-lucide="shopping-bag" aria-hidden="true"></i>
                        <span class="cart-count" :class="{ 'has-items': cartCount() > 0 }" x-show="cartCount() > 0"
                            x-text="cartCount()"></span>
                    </button>
                </div>
            </div>
        </header>

        <main class="container-wide">
            <h1 class="page-title reveal-section" data-reveal>Tienda</h1>

            <section class="filter-bar reveal-section" data-reveal aria-label="Filtros">
                <div class="filter-group" aria-label="Categorias">
                    <template x-for="category in categoryOptions()" :key="category">
                        <button class="filter-pill" type="button"
                            :class="{ 'is-active': selectedCategory === category }" @click="setCategory(category)"
                            x-text="category"></button>
                    </template>
                </div>
                <div class="filter-group" aria-label="Tallas">
                    <template x-for="size in sizeOptions()" :key="size">
                        <button class="filter-pill" type="button" :class="{ 'is-active': selectedSize === size }"
                            @click="setSize(size)" x-text="size"></button>
                    </template>
                </div>
            </section>

            <template x-if="error">
                <div class="error-state" x-text="error"></div>
            </template>
            <template x-if="loading && !error">
                <div class="loading-state">Cargando catalogo...</div>
            </template>
            <template x-if="!loading && !error && !filteredProducts().length">
                <div class="empty-state">
                    <p class="mb-3">No hay productos con esos filtros.</p>
                    <button class="secondary-button" type="button" @click="clearFilters()">Limpiar filtros</button>
                </div>
            </template>

            <section class="product-grid"
                x-show="!loading && !error && filteredProducts().length" aria-label="Catalogo completo">
                <template x-for="product in filteredProducts()" :key="product.id">
                    <article class="product-card">
                        <div class="product-media">
                            <span class="product-badge" x-show="product.badge" x-text="product.badge"></span>
                            <img :src="imageFor(product)" :alt="product.name" @error="handleImageError($event)">
                        </div>
                        <div class="product-info">
                            <h2 class="product-name" x-text="product.name"></h2>
                            <p class="product-price" x-text="priceLabel(product)"></p>
                            <p class="product-desc" x-text="product.description"></p>
                            <div class="size-row" aria-label="Seleccionar talla">
                                <template x-for="variant in product.variants" :key="variant.id">
                                    <button class="size-pill" type="button"
                                        :class="{ 'is-active': isVariantSelected(product, variant), 'is-disabled': !variant.available || Number(variant.stock) <= 0 }"
                                        :disabled="!variant.available || Number(variant.stock) <= 0"
                                        :title="Number(variant.stock) <= 0 || !variant.available ? 'Sin stock' : `${variant.stock} disponibles`"
                                        @click="selectVariant(product, variant)">
                                        <span x-text="variant.size"></span>
                                    </button>
                                </template>
                            </div>
                            <button class="primary-button product-action" type="button"
                                :disabled="!productHasStock(product)"
                                @click="addToCart(product, selectedVariant(product))">
                                Agregar al carrito
                            </button>
                        </div>
                    </article>
                </template>
            </section>
        </main>

        <footer class="site-footer reveal-section" data-reveal>
            <div class="footer-main">
                <div class="footer-column">
                    <img class="footer-logo" src="./assets/page/footer_logo.png" alt="RockStar Store">
                </div>
                <div class="footer-column footer-links">
                    <a href="./politicas.html">Politicas del servicio</a>
                    <a href="./terminos.html">Terminos y condiciones</a>
                </div>
                <div class="footer-column">
                    <div>
                        <p class="mb-0 fs-4">Redes Sociales</p>
                        <div class="socials">
                            <a href="https://www.facebook.com/share/14gv5KYt6cu/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook RockStar Store">
                                <img src="./assets/page/brand-facebook.png" alt="Facebook">
                            </a>
                            <a href="https://www.instagram.com/streetwear_rockstar?igsh=NTc4MTIwNjQ2YQ%3D%3D&utm_source=qr" target="_blank" rel="noopener noreferrer" aria-label="Instagram RockStar Store">
                                <img src="./assets/page/brand-instagram.png" alt="Instagram">
                            </a>
                            <img src="./assets/page/brand-tiktok.png" alt="TikTok">
                        </div>
                    </div>
                </div>
            </div>
            <div class="footer-copy">Todos los Derechos Reservados, Rockstar 2026</div>
        </footer>

        <template x-if="isCartOpen">
            <div class="drawer-backdrop" @click="closeCart()"></div>
        </template>
        <aside class="cart-drawer" :class="{ 'is-open': isCartOpen }" aria-label="Carrito">
            <div class="drawer-head">
                <h2 class="drawer-title">Carrito</h2>
                <button class="icon-button" type="button" @click="closeCart()" title="Cerrar carrito">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="drawer-body">
                <template x-if="!items.length">
                    <div class="empty-state">Tu carrito esta vacio.</div>
                </template>
                <template x-for="item in items" :key="item.variantId">
                    <div class="cart-item">
                        <div class="cart-thumb">
                            <img :src="getDriveImageUrl(item.image)" :alt="item.name" @error="handleImageError($event)">
                        </div>
                        <div>
                            <h3 x-text="item.name"></h3>
                            <p class="cart-meta">
                                <span x-text="`Talla ${item.selectedSize}`"></span>
                                <span x-text="` · ${formatMoney(item.price)}`"></span>
                            </p>
                            <div class="qty-row">
                                <button class="qty-button" type="button" @click="decrementItem(item)">-</button>
                                <strong x-text="item.quantity"></strong>
                                <button class="qty-button" type="button" @click="incrementItem(item)">+</button>
                                <button class="remove-button" type="button" @click="removeItem(item)">Eliminar</button>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <div class="drawer-foot">
                <div class="total-row">
                    <span>Total</span>
                    <span x-text="formatMoney(cartTotal())"></span>
                </div>
                <button class="primary-button w-100" type="button" :disabled="!items.length"
                    @click="openCheckout()">Checkout</button>
                <button class="secondary-button w-100 mt-2" type="button" x-show="items.length"
                    @click="clearCart()">Limpiar carrito</button>
            </div>
        </aside>

        <template x-if="isCheckoutOpen">
            <div class="modal-backdrop-custom"></div>
        </template>
        <section class="checkout-modal" x-show="isCheckoutOpen" x-transition aria-label="Checkout">
            <div class="modal-head">
                <h2 class="modal-title-custom">Checkout</h2>
                <button class="icon-button" type="button" @click="closeCheckout()" title="Cerrar checkout">
                    <i data-lucide="x"></i>
                </button>
            </div>
            <div class="modal-body-custom">
                <div class="checkout-grid">
                    <div>
                        <h3 class="h5 fw-bold mb-3">Resumen</h3>
                        <div class="summary-list">
                            <template x-for="item in items" :key="item.variantId">
                                <div class="summary-line">
                                    <span><strong x-text="item.name"></strong><br><small
                                            x-text="`Talla ${item.selectedSize} · Cantidad ${item.quantity}`"></small></span>
                                    <strong x-text="formatMoney(subtotal(item))"></strong>
                                </div>
                            </template>
                        </div>
                    </div>
                    <form @submit.prevent="sendWhatsAppOrder()">
                        <label class="form-label" for="checkout-name">Nombre completo</label>
                        <input class="field mb-2" id="checkout-name" type="text" x-model="checkout.name"
                            autocomplete="name">
                        <p class="invalid-hint" x-show="checkoutTouched && !checkout.name.trim()">Tu nombre es
                            necesario.</p>
                        <label class="form-label mt-2" for="checkout-phone">Telefono</label>
                        <input class="field mb-2" id="checkout-phone" type="tel" x-model="checkout.phone"
                            autocomplete="tel">
                        <p class="invalid-hint" x-show="checkoutTouched && !checkout.phone.trim()">Agrega un telefono.
                        </p>
                        <label class="form-label mt-2" for="checkout-address">Direccion o punto de entrega</label>
                        <textarea class="field mb-2" id="checkout-address" rows="3"
                            x-model="checkout.address"></textarea>
                        <p class="invalid-hint" x-show="checkoutTouched && !checkout.address.trim()">Indica donde
                            entregar.</p>
                        <label class="form-label mt-2" for="checkout-notes">Notas/referencias</label>
                        <textarea class="field" id="checkout-notes" rows="3" x-model="checkout.notes"></textarea>
                    </form>
                </div>
            </div>
            <div class="modal-foot">
                <div class="total-row">
                    <span>Total final</span>
                    <span x-text="formatMoney(cartTotal())"></span>
                </div>
                <button class="primary-button w-100" type="button" @click="sendWhatsAppOrder()">Enviar pedido por
                    WhatsApp</button>
            </div>
        </section>

        <div class="feedback-toast" x-show="feedback" x-transition x-text="feedback"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./js/config.js" defer></script>
    <script src="./js/utils.js" defer></script>
    <script src="./js/mock-data.js" defer></script>
    <script src="./js/api.js" defer></script>
    <script src="./js/theme.js" defer></script>
    <script src="./js/cart.js" defer></script>
    <script src="./js/app.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</body>

</html>
